name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Media_Android
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install wrapper dependencies from the lockfile
        run: npm ci

      - name: Typecheck Capacitor config
        run: npx tsc -p tsconfig.json --pretty false

      - name: Validate config before the frontend build
        run: node scripts/validate.mjs

      - name: Build the pinned JanaVignanam client
        run: npm run sync

      - name: Validate the built PWA assets and API target
        run: node scripts/validate.mjs

      - name: Sync the web bundle into the Android project
        run: npx cap sync android && node scripts/brand-android.mjs
