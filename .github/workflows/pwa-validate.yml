name: PWA validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Media_Android
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install wrapper dependencies from the lockfile
        run: npm ci

      - name: Build the pinned frontend
        run: npm run sync

      - name: Check manifest, icons, service worker, and API target
        run: node scripts/validate.mjs
