name: Signed release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Media_Android
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android 36 packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install wrapper dependencies
        run: npm ci

      - name: Stop when signing secrets are missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing signing secret::$name must be set before a tag can publish a release APK."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "No GitHub Release was created. An unsigned APK is not a production artifact."
            exit 1
          fi

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the pinned frontend and the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run sync
          npx cap sync android
          node scripts/brand-android.mjs
          node scripts/validate.mjs
          npm run gradle -- assembleRelease
          test -s android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Publish the signed APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: JanaVignanam ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Signed Android release of JanaVignanam. This is not a Google Play package.

            Install from the APK attached to this release. Android may ask you to allow installs from your browser. Updates install over the existing app only when they are signed with the same key and use application id `app.janavignanam.mobile`.

            The app talks to the existing Railway API. It does not include a native iPhone build. iPhone users install the website from Safari.
